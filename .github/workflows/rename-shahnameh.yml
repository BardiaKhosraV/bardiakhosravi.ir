name: Rename Shahnameh File

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/rename-shahnameh.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file and clean up workflow
        run: |
          f=$(ls -1 *.html | grep -vE '^(index|famous-persian-couplets|shahnameh)\.html$' | head -n 1)
          if [ -n "$f" ]; then
            git mv "$f" shahnameh.html
          fi
          git rm .github/workflows/rename-shahnameh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rename Shahnameh HTML to shahnameh.html"
          git push
