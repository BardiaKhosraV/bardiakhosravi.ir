      }
      @media (min-width: 640px) {
        .bk-writings-shell {

      .bk-writings-header {

        display: flex;

      .bk-writings-sub {

      .bk-archive-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        background-color: #dedbc8;
        color: #000000;
        font-weight: 600;
        font-size: 0.875rem;
        padding: 0.45rem 0.5rem 0.45rem 1.25rem;
        border-radius: 9999px;
        text-decoration: none;
        transition: background-color 0.25s ease, gap 0.25s ease, transform 0.25s ease;
        white-space: nowrap;
        flex-shrink: 0;
        direction: rtl;
      }
      .bk-archive-btn:hover {
        background-color: #eae7d5;
        gap: 1rem;
      }
      .bk-archive-btn-icon {
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 9999px;
        background-color: #000000;
        color: #e1e0cc;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.25s ease;
      }

      .bk-writings-grid {
        position: relative;

        transition: border-color 0.28s ease, background-color 0.28s ease, transform 0.28s ease;
      }
      .bk-article-card:hover {
        background-color: #232323;
        border-color: rgba(222, 219, 200, 0.42);
        transform: translateY(-2px);
      }
      .bk-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 1.15rem;
      }
      .bk-card-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.65rem;

        color: rgba(222, 219, 200, 0.85);
        background: rgba(0, 0, 0, 0.45);

      }
      .bk-card-cat {
        font-size: 0.72rem;
        color: #9ca3af;
        background: rgba(255, 255, 255, 0.05);
        padding: 0.25rem 0.65rem;
        border-radius: 9999px;
      }
      .bk-card-title {
        color: #e1e0cc;
        font-size: 1.2rem;
        font-weight: 600;
        line-height: 1.5;
        margin: 0 0 0.35rem;
      }
      .bk-card-subtitle {
        color: rgba(222, 219, 200, 0.78);

      }
      .bk-card-desc {

      }
      .bk-card-footer {
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(255, 255, 255, 0.06);

      }
      .bk-card-cta {
        display: inline-flex;

      }
      .bk-article-card:hover .bk-card-cta {

      }
      .bk-card-meta {

      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/articles-data.js"></script>
    <script>
      (function () {
        var fallbackArticles = [
          {
            id: 'famous-persian-couplets',
            number: '01',
            badge: '01 / LITERATURE',
            category: 'ادبیات فارسی',
            format: 'گزارش تحلیلی',
            title: 'پنجاه بیت ماندگار زبان فارسی',
            subtitle: 'از پرکاربردترین ضرب‌المثل‌ها تا غلط‌های مشهور',
            description: 'مروری ساختاریافته بر ۵۰ بیت پرکاربرد و ضرب‌المثل‌گونه از سعدی، صائب، حافظ، مولانا و فردوسی، همراه با نمودار آماری و بررسی ابیاتی که امروزه اشتباه خوانده می‌شوند.',
            url: '/famous-persian-couplets.html'
          },
          {
            id: 'shahnameh',
            number: '02',
            badge: '02 / CLASSICS',
            category: 'متون کلاسیک',
            format: 'متن کامل',
            title: 'شاهنامه فردوسی',
            subtitle: 'متن کامل، ساخت‌یافته و آرایه‌شده',
            description: 'نسخه کامل و ساختاریافته شاهنامه حکیم ابوالقاسم فردوسی با صفحه‌آرایی خوانا و آرایه‌شده برای مطالعه و مرور داستان‌های حماسی در وب.',
            url: '/shahnameh.html'
          }
        ];

        function escapeHtml(str) {
          return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function buildWritingsSection() {
          var articles = Array.isArray(window.SITE_ARTICLES) && window.SITE_ARTICLES.length
            ? window.SITE_ARTICLES.slice(0, 4)
            : fallbackArticles;

          var cardsHtml = articles.map(function (item) {
            return (
              '<a class="bk-article-card bk-fa" href="' + escapeHtml(item.url) + '">' +
                '<div>' +
                  '<div class="bk-card-top">' +
                    '<span class="bk-card-cat">' + escapeHtml(item.category) + '</span>' +
                    '<span class="bk-card-badge">' + escapeHtml(item.badge) + '</span>' +
                  '</div>' +
                  '<h3 class="bk-card-title">' + escapeHtml(item.title) + '</h3>' +
                  (item.subtitle ? '<p class="bk-card-subtitle">' + escapeHtml(item.subtitle) + '</p>' : '') +
                  '<p class="bk-card-desc">' + escapeHtml(item.description) + '</p>' +
                '</div>' +
                '<div class="bk-card-footer">' +
                  '<span class="bk-card-cta">' +
                    '<span>مطالعه مطلب</span>' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>' +
                  '</span>' +
                  '<span class="bk-card-meta">' + escapeHtml(item.format || 'HTML') + '</span>' +
                '</div>' +
              '</a>'
            );
          }).join('');

          var section = document.createElement('section');
          section.id = 'writings';
          section.setAttribute('aria-label', 'آخرین مطالب');
          section.innerHTML =
            '<div class="bk-writings-shell">' +
              '<div class="bk-writings-glow" aria-hidden="true"></div>' +
              '<div class="bk-writings-header">' +
                '<div class="bk-writings-heading-block bk-fa">' +
                  '<div class="bk-writings-kicker"><span class="bk-writings-dot"></span><span>LATEST WRITINGS · ARCHIVE</span></div>' +
                  '<h2 class="bk-writings-title">آخرین مطالب <span class="bk-writings-title-serif">Writings</span></h2>' +
                  '<p class="bk-writings-sub">یادداشت‌ها، پژوهش‌های ادبی و صفحه‌های خواندنی منتشرشده روی سایت.</p>' +
                '</div>' +
                '<a class="bk-archive-btn bk-fa" href="/articles.html">' +
                  '<span>فهرست کامل مطالب</span>' +
                  '<span class="bk-archive-btn-icon" aria-hidden="true">' +
                    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>' +
                  '</span>' +
                '</a>' +
              '</div>' +
              '<div class="bk-writings-grid">' + cardsHtml + '</div>' +
            '</div>';
          return section;
        }

        function mountWritings() {
          var footer = document.querySelector('#root footer');
          if (!footer) return false;

          if (!document.getElementById('writings')) {
            footer.parentNode.insertBefore(buildWritingsSection(), footer);
          }

          var nav = document.querySelector('#root header nav');
          if (nav && !nav.querySelector('[data-bk-nav="writings"]')) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.setAttribute('data-bk-nav', 'writings');
            btn.textContent = 'Writings';
            btn.style.color = 'rgba(225, 224, 204, 0.8)';
            btn.className = 'text-[10px] sm:text-xs md:text-sm font-normal tracking-wide transition-colors duration-200 cursor-pointer whitespace-nowrap focus:outline-none';
            btn.addEventListener('mouseenter', function () { btn.style.color = '#E1E0CC'; });
            btn.addEventListener('mouseleave', function () { btn.style.color = 'rgba(225, 224, 204, 0.8)'; });
            btn.addEventListener('click', function () {
              var target = document.getElementById('writings');
              if (target) target.scrollIntoView({ behavior: 'smooth' });
            });
            var lastBtn = nav.lastElementChild;
            if (lastBtn) {
              nav.insertBefore(btn, lastBtn);
            } else {
              nav.appendChild(btn);
            }
          }

          return true;
        }

        if (!mountWritings()) {
          var observer = new MutationObserver(function () {
            if (mountWritings()) {
              observer.disconnect();
            }
          });
          observer.observe(document.getElementById('root'), { childList: true, subtree: true });
        }
      })();
    </script>
  </body>
</html>
