    <style>
      img[src="/photo.webp"] { filter: none !important; }

      .bk-writings-glow {

      .bk-writings-kicker {

      .bk-writings-title {

      @media (min-width: 768px) {
        .bk-writings-title {

      }
      .bk-writings-title-serif {
        font-family: 'Instrument Serif', serif;
        font-style: italic;

        font-weight: 400;

      }
      .bk-writings-sub {
        color: rgba(222, 219, 200, 0.72);
        font-size: 0.92rem;
        line-height: 1.65;
        margin: 0.65rem 0 0;

      }
      .bk-archive-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        background-color: #dedbc8;
        color: #000000;
        font-weight: 500;
        font-size: 0.875rem;
        padding: 0.45rem 0.5rem 0.45rem 1.3rem;

      }
      .bk-archive-btn:hover {
        background-color: #eae7d5;
        gap: 1rem;
      }
      .bk-archive-btn-icon {
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 9999px;
        background-color: #000000;
        color: #e1e0cc;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.25s ease;
      }
      .bk-archive-btn:hover .bk-archive-btn-icon {
        transform: scale(1.08);
      }
      .bk-writings-grid {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      @media (min-width: 768px) {
        .bk-writings-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 1.25rem;

      .bk-article-card {
        display: flex;

      }
      .bk-article-card:hover {
        background-color: #232323;
        border-color: rgba(222, 219, 200, 0.42);
        transform: translateY(-2px);
      }
      .bk-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 1.15rem;
      }
      .bk-card-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.65rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(222, 219, 200, 0.85);
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.06);
        padding: 0.25rem 0.6rem;
        border-radius: 0.4rem;
      }
      .bk-card-cat {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.68rem;
        color: #9ca3af;
        background: rgba(255, 255, 255, 0.05);
        padding: 0.25rem 0.65rem;
        border-radius: 9999px;
      }
      .bk-card-title {
        color: #e1e0cc;
        font-size: 1.25rem;
        font-weight: 500;
        line-height: 1.35;
        letter-spacing: -0.015em;
        margin: 0 0 0.3rem;
      }
      .bk-card-subtitle {
        color: rgba(222, 219, 200, 0.78);
        font-size: 0.85rem;

      }
      .bk-card-desc {

      }
      .bk-card-footer {
        margin-top: 1.5rem;

        display: flex;
        align-items: center;
        justify-content: space-between;

      }
      .bk-card-cta {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: #dedbc8;
        font-size: 0.8rem;
        font-weight: 500;
        transition: color 0.2s ease;
      }
      .bk-article-card:hover .bk-card-cta {
        color: #ffffff;
      }
      .bk-card-meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.68rem;
        color: #6b7280;
      }
    
      /* ===== Cross-Device & Cross-Mobile-Browser Responsiveness ===== */
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        overflow-x: hidden;
        overflow-x: clip;
        min-height: 100vh;
        min-height: 100dvh;
        -webkit-tap-highlight-color: transparent;
      }
      button, a { touch-action: manipulation; }

      /* iOS Safari backdrop-filter support & safe-area header */
      #root header {
        padding-top: env(safe-area-inset-top, 0px);
        padding-inline: max(0.5rem, env(safe-area-inset-left, 0px)) max(0.5rem, env(safe-area-inset-right, 0px));
      }
      #root header nav {
        -webkit-backdrop-filter: blur(12px);
        max-width: calc(100vw - 1rem);
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      #root header nav::-webkit-scrollbar { display: none; }

      /* Dynamic viewport height for hero & modals on iOS Safari / Android Chrome / Samsung Internet */
      #root .min-h-screen {
        min-height: 100vh;
        min-height: 100svh;
      }
      #root .bg-\[\#121212\] {
        max-height: 90vh;
        max-height: 90dvh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* Prevent stuck hover state on touch devices */
      @media (hover: none) {
        .bk-article-card:hover { transform: none; }
        .bk-archive-btn:hover { gap: 0.75rem; }
      }

      /* Safe areas & small-phone (320px-480px) refinements for Latest Writings */
      #writings {
        padding-inline: max(0.85rem, env(safe-area-inset-left, 0px)) max(0.85rem, env(safe-area-inset-right, 0px));
      }
      .bk-writings-title { font-size: clamp(1.65rem, 5.2vw, 2.65rem); }
      .bk-card-top, .bk-card-footer { flex-wrap: wrap; }
      @media (max-width: 480px) {
        #writings { padding-top: 3.25rem; padding-bottom: 4.5rem; }
        .bk-writings-shell { padding: 1.5rem 1rem; border-radius: 1.15rem; }
        .bk-article-card { padding: 1.15rem; }
        .bk-archive-btn { width: 100%; justify-content: space-between; padding: 0.45rem 0.5rem 0.45rem 1.1rem; }
      }
      #root footer {
        padding-bottom: max(2rem, env(safe-area-inset-bottom, 0px));
      }

    
      @media (min-width: 1280px) {
        .bk-writings-shell { max-width: 84rem; padding: 4.5rem 4rem; }
        .bk-writings-grid { gap: 1.5rem; }
      }
      @media (min-width: 1600px) {
        .bk-writings-shell { max-width: 90rem; }
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/articles-data.js"></script>
    <script>
      (function () {
        var fallbackArticles = [
          {
            id: 'famous-persian-couplets',
            number: '01',
            badge: '01 / LITERATURE',
            category: 'Persian Literature',
            format: 'Analytical Guide · Persian',
            title: 'Fifty Timeless Persian Couplets',
            subtitle: 'From everyday proverbs to famous misreadings',
            description: 'A structured exploration of 50 widely quoted Persian couplets by Saadi, Saeb, Hafez, Rumi, and Ferdowsi — complete with proverb frequency charts and commonly misread verses.',
            url: '/famous-persian-couplets.html'
          },
          {
            id: 'shahnameh',
            number: '02',
            badge: '02 / CLASSICS',
            category: 'Classical Texts',
            format: 'Complete Edition · Persian',
            title: 'Shahnameh of Ferdowsi',
            subtitle: 'Complete, structured & annotated web edition',
            description: 'The complete epic text of Hakim Abolqasem Ferdowsi’s Shahnameh, organized with clean typography and readable structure for effortless browsing on the web.',
            url: '/shahnameh.html'
          }
        ];

        function escapeHtml(str) {
          return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function buildWritingsSection() {
          var articles = Array.isArray(window.SITE_ARTICLES) && window.SITE_ARTICLES.length
            ? window.SITE_ARTICLES.slice(0, 4)
            : fallbackArticles;

          var cardsHtml = articles.map(function (item) {
            return (
              '<a class="bk-article-card" href="' + escapeHtml(item.url) + '">' +
                '<div>' +
                  '<div class="bk-card-top">' +
                    '<span class="bk-card-badge">' + escapeHtml(item.badge) + '</span>' +
                    '<span class="bk-card-cat">' + escapeHtml(item.category) + '</span>' +
                  '</div>' +
                  '<h3 class="bk-card-title">' + escapeHtml(item.title) + '</h3>' +
                  (item.subtitle ? '<p class="bk-card-subtitle">' + escapeHtml(item.subtitle) + '</p>' : '') +
                  '<p class="bk-card-desc">' + escapeHtml(item.description) + '</p>' +
                '</div>' +
                '<div class="bk-card-footer">' +
                  '<span class="bk-card-cta">' +
                    '<span>Read article</span>' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>' +
                  '</span>' +
                  '<span class="bk-card-meta">' + escapeHtml(item.format || 'HTML') + '</span>' +
                '</div>' +
              '</a>'
            );
          }).join('');

          var section = document.createElement('section');
          section.id = 'writings';
          section.setAttribute('aria-label', 'Latest Writings');
          section.innerHTML =
            '<div class="bk-writings-shell">' +
              '<div class="bk-writings-glow" aria-hidden="true"></div>' +
              '<div class="bk-writings-header">' +
                '<div>' +
                  '<div class="bk-writings-kicker"><span class="bk-writings-dot"></span><span>LATEST WRITINGS · ARCHIVE</span></div>' +
                  '<h2 class="bk-writings-title">Latest <span class="bk-writings-title-serif">Writings</span></h2>' +
                  '<p class="bk-writings-sub">Essays, literary studies, and standalone web editions published on this site.</p>' +
                '</div>' +
                '<a class="bk-archive-btn" href="/articles.html">' +
                  '<span>View All Articles</span>' +
                  '<span class="bk-archive-btn-icon" aria-hidden="true">' +
                    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>' +
                  '</span>' +
                '</a>' +
              '</div>' +
              '<div class="bk-writings-grid">' + cardsHtml + '</div>' +
            '</div>';
          return section;
        }

        function enhanceConnectModal() {
          var forms = document.querySelectorAll('#root form');
          forms.forEach(function (form) {
            var modal = form.closest('.bg-\\[\\#121212\\]');
            if (!modal) return;
            if (!modal.querySelector('.bk-connect-note')) {
              var note = document.createElement('p');
              note.className = 'bk-connect-note';
              note.textContent = 'Direct email or LinkedIn is the best way to reach me.';
              form.parentNode.insertBefore(note, form);
            }
          });
        }

        function mountEnhancements() {
          var footer = document.querySelector('#root footer');
          if (footer && !document.getElementById('writings')) {
            footer.parentNode.insertBefore(buildWritingsSection(), footer);
          }

          var nav = document.querySelector('#root header nav');
          if (nav && !nav.querySelector('[data-bk-nav="writings"]')) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.setAttribute('data-bk-nav', 'writings');
            btn.textContent = 'Writings';
            btn.style.color = 'rgba(225, 224, 204, 0.8)';
            btn.className = 'text-[10px] sm:text-xs md:text-sm font-normal tracking-wide transition-colors duration-200 cursor-pointer whitespace-nowrap focus:outline-none';
            btn.addEventListener('mouseenter', function () { btn.style.color = '#E1E0CC'; });
            btn.addEventListener('mouseleave', function () { btn.style.color = 'rgba(225, 224, 204, 0.8)'; });
            btn.addEventListener('click', function () {
              var target = document.getElementById('writings');
              if (target) target.scrollIntoView({ behavior: 'smooth' });
            });
            var lastBtn = nav.lastElementChild;
            if (lastBtn) {
              nav.insertBefore(btn, lastBtn);
            } else {
              nav.appendChild(btn);
            }
          }

          enhanceConnectModal();
        }

        mountEnhancements();
        var observer = new MutationObserver(mountEnhancements);
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
      })();
    </script>
  </body>
